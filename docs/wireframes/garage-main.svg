<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title>mdp_garages — Pantalla principal del garaje (wireframe, base 1920x1080)</title>
  <defs>
    <style>
      .t1{fill:#FAFAFA}.t2{fill:#D4D4D4}.t3{fill:#A1A1A1}.ann{fill:#84B2FF;font-size:13px;font-family:ui-monospace,Consolas,monospace}
      .h{font-family:Rajdhani,Inter,sans-serif;font-weight:700}
      .card{fill:#171717;stroke:#262626;stroke-width:1}
      .sel{fill:#262626;stroke:#3373FF;stroke-width:2}
      .callout{stroke:#84B2FF;stroke-width:1;stroke-dasharray:4 4;fill:none}
    </style>
  </defs>
  <!-- Fondo de juego simulado (NUI transparente) -->
  <rect width="1920" height="1080" fill="#3a4250"/>
  <text x="24" y="40" fill="#cfd6e2" font-size="16">[ escena del juego — body transparente ]</text>

  <!-- Contenedor principal 1180x680 centrado -->
  <rect x="370" y="200" width="1180" height="680" rx="16" fill="#0A0A0A" stroke="#404040"/>

  <!-- Header -->
  <text x="402" y="250" class="t1 h" font-size="30">GARAJE CENTRAL — PILLBOX</text>
  <text x="402" y="274" class="t3" font-size="14">8 vehículos · 5 guardados · 2 fuera · 1 incautado</text>
  <rect x="1486" y="226" width="40" height="40" rx="8" fill="#171717" stroke="#404040"/>
  <text x="1499" y="253" class="t2" font-size="20">✕</text>
  <text x="1300" y="246" class="ann">Close button (Buttons) ↗</text>
  <line x1="370" y1="296" x2="1550" y2="296" stroke="#262626"/>

  <!-- Columna lista 420px -->
  <rect x="370" y="296" width="420" height="584" fill="#0A0A0A"/>
  <line x1="790" y1="296" x2="790" y2="880" stroke="#262626"/>
  <!-- Tabs -->
  <rect x="386" y="312" width="388" height="36" rx="8" fill="#171717" stroke="#262626"/>
  <rect x="390" y="316" width="92" height="28" rx="6" fill="#262626"/>
  <text x="408" y="335" class="t1" font-size="13" font-weight="600">Todos 8</text>
  <text x="496" y="335" class="t3" font-size="13">Guardados</text>
  <text x="580" y="335" class="t3" font-size="13">Fuera</text>
  <text x="640" y="335" class="t3" font-size="13">Incautados</text>
  <!-- Input -->
  <rect x="386" y="358" width="388" height="40" rx="8" fill="#171717" stroke="#404040"/>
  <text x="402" y="383" class="t3" font-size="14">⌕  Buscar por nombre o matrícula…</text>

  <!-- Card seleccionada -->
  <rect x="386" y="410" width="388" height="96" rx="12" class="sel"/>
  <rect x="386" y="418" width="3" height="80" fill="#3373FF"/>
  <text x="402" y="440" class="t1 h" font-size="20">Pegassi Zentorno</text>
  <rect x="660" y="424" width="98" height="22" rx="11" fill="#052e16" stroke="#166534"/>
  <circle cx="672" cy="435" r="3" fill="#22C55E"/><text x="680" y="440" fill="#4ADE80" font-size="11" font-weight="600">GUARDADO</text>
  <rect x="402" y="452" width="80" height="20" rx="4" fill="#E9EDF3"/><text x="410" y="467" fill="#0A0A0A" font-size="11" font-family="Consolas,monospace" font-weight="700">MDP 4821</text>
  <rect x="490" y="452" width="70" height="20" rx="10" fill="#262626" stroke="#404040"/><text x="500" y="466" class="t2" font-size="11">Súper</text>
  <rect x="402" y="486" width="110" height="4" rx="2" fill="#262626"/><rect x="402" y="486" width="101" height="4" rx="2" fill="#22C55E"/>
  <rect x="520" y="486" width="110" height="4" rx="2" fill="#262626"/><rect x="520" y="486" width="80" height="4" rx="2" fill="#22C55E"/>
  <rect x="638" y="486" width="110" height="4" rx="2" fill="#262626"/><rect x="638" y="486" width="45" height="4" rx="2" fill="#EAB308"/>

  <!-- Card fuera -->
  <rect x="386" y="514" width="388" height="96" rx="12" class="card"/>
  <text x="402" y="544" class="t1 h" font-size="20">Bravado Buffalo STX</text>
  <rect x="680" y="528" width="78" height="22" rx="11" fill="#422006" stroke="#854d0e"/>
  <circle cx="692" cy="539" r="3" fill="#EAB308"/><text x="700" y="544" fill="#FACC15" font-size="11" font-weight="600">FUERA</text>
  <rect x="402" y="556" width="80" height="20" rx="4" fill="#E9EDF3"/><text x="410" y="571" fill="#0A0A0A" font-size="11" font-family="Consolas,monospace" font-weight="700">LSPD 019</text>
  <rect x="490" y="556" width="74" height="20" rx="10" fill="#262626" stroke="#404040"/><text x="500" y="570" class="t2" font-size="11">Muscle</text>
  <rect x="402" y="590" width="346" height="4" rx="2" fill="#262626"/>

  <!-- Card incautado -->
  <rect x="386" y="618" width="388" height="96" rx="12" class="card" opacity="0.85"/>
  <text x="402" y="648" class="t1 h" font-size="20">Karin Sultan RS</text>
  <rect x="650" y="632" width="108" height="22" rx="11" fill="#450a0a" stroke="#991b1b"/>
  <circle cx="662" cy="643" r="3" fill="#EF4444"/><text x="670" y="648" fill="#F87171" font-size="11" font-weight="600">INCAUTADO</text>
  <rect x="402" y="660" width="80" height="20" rx="4" fill="#E9EDF3"/><text x="410" y="675" fill="#0A0A0A" font-size="11" font-family="Consolas,monospace" font-weight="700">7XK 22B</text>
  <rect x="402" y="694" width="110" height="4" rx="2" fill="#262626"/><rect x="402" y="694" width="22" height="4" rx="2" fill="#EF4444"/>
  <rect x="386" y="722" width="388" height="96" rx="12" class="card" opacity="0.5"/>
  <text x="402" y="752" class="t3 h" font-size="20">…</text>

  <!-- Panel detalle -->
  <text x="822" y="340" class="t1 h" font-size="36">PEGASSI ZENTORNO</text>
  <rect x="1188" y="316" width="98" height="24" rx="12" fill="#052e16" stroke="#166534"/>
  <circle cx="1201" cy="328" r="3" fill="#22C55E"/><text x="1210" y="333" fill="#4ADE80" font-size="11" font-weight="600">GUARDADO</text>
  <text x="822" y="366" class="t3" font-size="14">Matrícula MDP 4821 · Súper · Garaje Central</text>
  <rect x="822" y="384" width="696" height="200" rx="12" fill="#171717" stroke="#262626"/>
  <rect x="1130" y="444" width="80" height="80" rx="40" fill="#101F4F" stroke="#1848CC"/>
  <text x="1153" y="494" fill="#84B2FF" font-size="28">🚗</text>
  <text x="1040" y="560" class="t3" font-size="13">Hero: Featured icon (brand, xl) / imagen del modelo</text>

  <!-- Barras -->
  <text x="822" y="624" class="t2" font-size="12" font-weight="600" letter-spacing="1">MOTOR</text><text x="1480" y="624" class="t1" font-size="13" font-family="Consolas,monospace">92%</text>
  <rect x="822" y="634" width="696" height="8" rx="4" fill="#262626"/><rect x="822" y="634" width="640" height="8" rx="4" fill="#22C55E"/>
  <text x="822" y="672" class="t2" font-size="12" font-weight="600" letter-spacing="1">CARROCERÍA</text><text x="1480" y="672" class="t1" font-size="13" font-family="Consolas,monospace">73%</text>
  <rect x="822" y="682" width="696" height="8" rx="4" fill="#262626"/><rect x="822" y="682" width="508" height="8" rx="4" fill="#22C55E"/>
  <text x="822" y="720" class="t2" font-size="12" font-weight="600" letter-spacing="1">COMBUSTIBLE</text><text x="1480" y="720" class="t1" font-size="13" font-family="Consolas,monospace">41%</text>
  <rect x="822" y="730" width="696" height="8" rx="4" fill="#262626"/><rect x="822" y="730" width="285" height="8" rx="4" fill="#EAB308"/>

  <!-- Acciones -->
  <rect x="822" y="808" width="560" height="48" rx="8" fill="#1F5CF0"/>
  <text x="1030" y="838" fill="#FFFFFF" font-size="16" font-weight="600">Sacar vehículo  ↵</text>
  <rect x="1394" y="808" width="124" height="48" rx="8" fill="#171717" stroke="#404040"/>
  <text x="1418" y="838" class="t2" font-size="15" font-weight="600">Transferir</text>

  <!-- Toast -->
  <rect x="1556" y="24" width="340" height="68" rx="10" fill="#171717" stroke="#262626"/>
  <circle cx="1586" cy="58" r="12" fill="#052e16" stroke="#166534"/><text x="1580" y="63" fill="#4ADE80" font-size="13">✓</text>
  <text x="1608" y="52" class="t1" font-size="14" font-weight="600">Vehículo guardado</text>
  <text x="1608" y="72" class="t3" font-size="12">Buffalo STX · LSPD 019</text>

  <!-- Anotaciones de componentes Untitled UI -->
  <g class="ann">
    <text x="24" y="330">Tabs (type="button-gray", FREE) →</text>
    <text x="24" y="382">Input (icon=SearchLg, size="md", FREE) →</text>
    <text x="24" y="440">Tarjeta: div custom con tokens UUI →</text>
    <text x="24" y="458">  + Badge / BadgeWithDot (FREE)</text>
    <text x="24" y="476">  + Progress bar (ProgressBarBase, FREE)</text>
    <text x="24" y="660">Badge color="error" (incautado) →</text>
    <text x="1560" y="330">← BadgeWithDot (pill-color, md)</text>
    <text x="1560" y="480">← Featured icon (FREE)</text>
    <text x="1560" y="684">← Progress bar (ProgressBar,</text>
    <text x="1560" y="702">   labelPosition="top" custom, FREE)</text>
    <text x="1560" y="836">← Button primary lg / secondary lg</text>
    <text x="1560" y="112">↑ Toast: sonner + Featured icon (FREE)</text>
    <text x="1560" y="130">  ("Notifications" de UUI = PRO)</text>
    <text x="370" y="910">Modal (ModalOverlay+Modal+Dialog, FREE) para confirmaciones · Empty state (FREE) · Loading indicator (FREE)</text>
  </g>

  <!-- Mini: estado vacío -->
  <rect x="24" y="940" width="560" height="120" rx="12" fill="#0A0A0A" stroke="#404040"/>
  <text x="40" y="964" class="ann">ESTADO VACÍO — Empty state (FREE) + Featured icon</text>
  <circle cx="80" cy="1012" r="24" fill="#262626"/><text x="70" y="1020" class="t2" font-size="20">∅</text>
  <text x="120" y="1006" class="t1 h" font-size="20">No hay vehículos en este garaje</text>
  <text x="120" y="1028" class="t3" font-size="13">Guarda un vehículo cerca del punto para verlo aquí.</text>
  <rect x="120" y="1036" width="100" height="18" rx="4" fill="#171717" stroke="#404040"/><text x="132" y="1049" class="t2" font-size="11">Cerrar (secondary)</text>

  <!-- Mini: incautado -->
  <rect x="604" y="940" width="760" height="120" rx="12" fill="#0A0A0A" stroke="#991b1b"/>
  <text x="620" y="964" class="ann">INCAUTADO — panel detalle (Featured icon error + texto, alternativa FREE a Alerts PRO)</text>
  <rect x="620" y="976" width="728" height="40" rx="8" fill="#450a0a" stroke="#991b1b"/>
  <text x="636" y="1001" fill="#F87171" font-size="13">⚠ Incautado por LSPD · Multa $2.500 · Recoger en Depósito Municipal</text>
  <rect x="620" y="1024" width="360" height="30" rx="8" fill="#B91C1C"/><text x="700" y="1044" fill="#fff" font-size="13" font-weight="600">Pagar y recuperar ($2.500)</text>
  <rect x="992" y="1024" width="160" height="30" rx="8" fill="#171717" stroke="#404040"/><text x="1020" y="1044" class="t2" font-size="13">Marcar en GPS</text>
  <text x="1168" y="1044" class="ann">primary-destructive / secondary</text>
</svg>
